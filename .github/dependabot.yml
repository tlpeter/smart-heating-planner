# Keeps the app's npm packages, the Docker base image and the GitHub Actions
# up to date. Pull requests go to dev: test there first, then release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /smart_heating_planner/app
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /smart_heating_planner
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
