name: Tests

# Runs every test on each push and pull request. A red result means: do not
# release this version.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, persistence, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_heating_planner/app
      - name: Check JavaScript syntax
        shell: bash
        run: find smart_heating_planner/app tests -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check config.yaml matches package.json
        shell: bash
        run: |
          app=$(node -p "require('./smart_heating_planner/app/package.json').version")
          cfg=$(sed -n 's/^version: "\(.*\)"/\1/p' smart_heating_planner/config.yaml)
          lock=$(node -p "require('./smart_heating_planner/app/package-lock.json').version")
          echo "package.json $app, package-lock.json $lock, config.yaml $cfg"
          test "$app" = "$lock"
          test "${cfg%-dev}" = "$app"
      - name: Critical-module coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='smart_heating_planner/app/*.js'
          --test-coverage-exclude='smart_heating_planner/app/server.js'
          --test-coverage-exclude='smart_heating_planner/app/controller.js'
          --test-coverage-exclude='smart_heating_planner/app/ha.js'
          --test-coverage-lines=70
          --test-coverage-functions=70
          --test-coverage-branches=60
          tests/schedule.test.js tests/presence.test.js tests/decide.test.js tests/control.test.js tests/heatmeister.test.js tests/entities.test.js tests/persistence.test.js

  tests:
    name: Tests (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file: [settings.test.js, control-app.test.js, schedule.test.js, control.test.js, presence.test.js, decide.test.js, entities.test.js, persistence.test.js]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_heating_planner/app
      - run: node tests/testplan.js run ${{ matrix.file }} results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: results/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shp-test smart_heating_planner

  testplan:
    name: Update the test plan
    # After every push: write tests/TESTPLAN.md from the results above and
    # save it in the branch when it changed. Also when a test failed, so the
    # plan shows what failed.
    needs: [tests]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Write TESTPLAN.md
        run: node tests/testplan.js write results
      - name: Save TESTPLAN.md in the branch
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet -- tests/TESTPLAN.md; then
            echo "The test plan did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TESTPLAN.md
          git commit -m "Test plan: results of ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
