name: Smart Heating Planner
version: "0.1.0"
slug: smart_heating_planner
description: "TEST VERSION, watch only: heats on a schedule and on who is home (tado + Heatmeister)."
url: https://github.com/tlpeter/smart-heating-planner
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: Smart Heating
homeassistant_api: true
options:
  refresh_seconds: 30
  log_level: info
schema:
  refresh_seconds: int(10,600)
  log_level: list(debug|info|warning|error)
