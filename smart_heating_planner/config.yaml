name: Smart Heating Planner
version: "0.5.0"
slug: smart_heating_planner
description: "Heats on a schedule and on who is home (tado + HeatMeister)."
url: https://github.com/tlpeter/smart-heating-planner
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: Smart Heating
homeassistant_api: true
options:
  allow_control: false
  allow_heatmeister_temperature: false
  allow_heatmeister_target: false
  max_writes_per_day: 48
  refresh_seconds: 30
  log_level: info
schema:
  allow_control: bool
  allow_heatmeister_temperature: bool
  allow_heatmeister_target: bool
  max_writes_per_day: int(1,500)
  refresh_seconds: int(10,600)
  log_level: list(debug|info|warning|error)
